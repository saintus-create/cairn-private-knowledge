name: Compile Agentic Workflows

on:
  push:
    paths:
      - '.github/workflows/*.md'
      - '.github/workflows/compile-agentic-workflows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up GitHub CLI
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install GitHub Agentic Workflows extension
        run: gh extension install github/gh-aw
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile agentic workflows
        run: gh aw compile
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit generated lockfiles
        run: |
          if git diff --quiet -- .github/workflows/*.lock.yml; then
            echo 'No lockfile changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/*.lock.yml
          git commit -m 'chore: compile agentic workflows'
          git push
